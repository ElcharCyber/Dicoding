<?xml version="1.0" encoding="UTF-8"?>
<svg width="1800" height="1100" viewBox="0 0 1800 1100" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feOffset dx="0" dy="6" result="offset" />
      <feFlood flood-color="#000000" flood-opacity="0.35" />
      <feComposite in2="offset" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="4" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="1800" height="1100" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3" />
  </pattern>
  <rect width="1800" height="1100" fill="url(#grid)" />

  <!-- Header Title -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="460" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
    <text x="20" y="32" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="0.5">OPENJOB RESTFUL API</text>
    <text x="20" y="50" fill="#38bdf8" font-size="13" font-weight="600" letter-spacing="1">ENTITY RELATIONSHIP DIAGRAM (VERSI 1)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(1380, 50)">
    <rect x="0" y="0" width="360" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="15" y="24" fill="#94a3b8" font-size="12" font-weight="600">NOTASI KUNCI:</text>
    <rect x="15" y="34" width="28" height="16" rx="4" fill="#ef4444" />
    <text x="21" y="46" fill="#ffffff" font-size="10" font-weight="700">PK</text>
    <text x="48" y="46" fill="#cbd5e1" font-size="12">Primary Key</text>

    <rect x="135" y="34" width="28" height="16" rx="4" fill="#3b82f6" />
    <text x="141" y="46" fill="#ffffff" font-size="10" font-weight="700">FK</text>
    <text x="168" y="46" fill="#cbd5e1" font-size="12">Foreign Key</text>

    <rect x="255" y="34" width="28" height="16" rx="4" fill="#10b981" />
    <text x="261" y="46" fill="#ffffff" font-size="10" font-weight="700">UK</text>
    <text x="288" y="46" fill="#cbd5e1" font-size="12">Unique Key</text>
  </g>

  <!-- RELATIONSHIP LINES -->
  <!-- companies (id) -> jobs (company_id) -->
  <path d="M 370 280 L 730 280" fill="none" stroke="#38bdf8" stroke-width="2" marker-start="url(#dot)" marker-end="url(#arrow)" />
  <text x="540" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">1 : N (company_id)</text>

  <!-- categories (id) -> jobs (category_id) -->
  <path d="M 370 560 L 550 560 L 550 420 L 730 420" fill="none" stroke="#38bdf8" stroke-width="2" marker-start="url(#dot)" marker-end="url(#arrow)" />
  <text x="520" y="540" fill="#94a3b8" font-size="12" text-anchor="middle">1 : N (category_id)</text>

  <!-- users (id) -> applications (user_id) -->
  <path d="M 1430 310 L 1430 430 L 1400 430" fill="none" stroke="#38bdf8" stroke-width="2" marker-start="url(#dot)" marker-end="url(#arrow)" />
  <text x="1455" y="370" fill="#94a3b8" font-size="12">1 : N (user_id)</text>

  <!-- jobs (id) -> applications (job_id) -->
  <path d="M 1070 340 L 1150 340 L 1150 450 L 1160 450" fill="none" stroke="#38bdf8" stroke-width="2" marker-start="url(#dot)" marker-end="url(#arrow)" />
  <text x="1110" y="330" fill="#94a3b8" font-size="12">1 : N (job_id)</text>

  <!-- users (id) -> bookmarks (user_id) -->
  <path d="M 1520 310 L 1520 830 L 1400 830" fill="none" stroke="#38bdf8" stroke-width="2" marker-start="url(#dot)" marker-end="url(#arrow)" />
  <text x="1530" y="600" fill="#94a3b8" font-size="12">1 : N (user_id)</text>

  <!-- jobs (id) -> bookmarks (job_id) -->
  <path d="M 900 680 L 900 850 L 1160 850" fill="none" stroke="#38bdf8" stroke-width="2" marker-start="url(#dot)" marker-end="url(#arrow)" />
  <text x="920" y="780" fill="#94a3b8" font-size="12">1 : N (job_id)</text>


  <!-- TABLE: COMPANIES -->
  <g transform="translate(60, 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="230" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 0 L 310 0 L 310 40 L 0 40 Z" fill="#0284c7" rx="8" />
    <text x="15" y="26" fill="#ffffff" font-size="15" font-weight="700">companies</text>
    <text x="295" y="25" fill="#e0f2fe" font-size="11" text-anchor="end">TABLE</text>
    
    <!-- columns -->
    <g transform="translate(15, 62)">
      <rect x="0" y="-12" width="26" height="15" rx="3" fill="#ef4444" />
      <text x="5" y="-1" fill="#fff" font-size="9" font-weight="700">PK</text>
      <text x="35" y="0" fill="#f8fafc" font-size="13" font-weight="600">id</text>
      <text x="280" y="0" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <text x="35" y="28" fill="#f8fafc" font-size="13">name</text>
      <text x="280" y="28" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(255)</text>

      <text x="35" y="56" fill="#f8fafc" font-size="13">location</text>
      <text x="280" y="56" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(255)</text>

      <text x="35" y="84" fill="#f8fafc" font-size="13">description</text>
      <text x="280" y="84" fill="#94a3b8" font-size="12" text-anchor="end">TEXT</text>

      <text x="35" y="112" fill="#64748b" font-size="12">created_at</text>
      <text x="280" y="112" fill="#64748b" font-size="12" text-anchor="end">TIMESTAMPTZ</text>

      <text x="35" y="140" fill="#64748b" font-size="12">updated_at</text>
      <text x="280" y="140" fill="#64748b" font-size="12" text-anchor="end">TIMESTAMPTZ</text>
    </g>
  </g>

  <!-- TABLE: CATEGORIES -->
  <g transform="translate(60, 470)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="170" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 0 L 310 0 L 310 40 L 0 40 Z" fill="#0284c7" rx="8" />
    <text x="15" y="26" fill="#ffffff" font-size="15" font-weight="700">categories</text>
    <text x="295" y="25" fill="#e0f2fe" font-size="11" text-anchor="end">TABLE</text>
    
    <g transform="translate(15, 62)">
      <rect x="0" y="-12" width="26" height="15" rx="3" fill="#ef4444" />
      <text x="5" y="-1" fill="#fff" font-size="9" font-weight="700">PK</text>
      <text x="35" y="0" fill="#f8fafc" font-size="13" font-weight="600">id</text>
      <text x="280" y="0" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <text x="35" y="28" fill="#f8fafc" font-size="13">name</text>
      <text x="280" y="28" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(255)</text>

      <text x="35" y="56" fill="#64748b" font-size="12">created_at</text>
      <text x="280" y="56" fill="#64748b" font-size="12" text-anchor="end">TIMESTAMPTZ</text>

      <text x="35" y="84" fill="#64748b" font-size="12">updated_at</text>
      <text x="280" y="84" fill="#64748b" font-size="12" text-anchor="end">TIMESTAMPTZ</text>
    </g>
  </g>

  <!-- TABLE: AUTHENTICATIONS -->
  <g transform="translate(60, 720)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="110" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 0 L 310 0 L 310 40 L 0 40 Z" fill="#475569" rx="8" />
    <text x="15" y="26" fill="#ffffff" font-size="15" font-weight="700">authentications</text>
    <text x="295" y="25" fill="#e2e8f0" font-size="11" text-anchor="end">TABLE</text>
    
    <g transform="translate(15, 66)">
      <text x="35" y="0" fill="#f8fafc" font-size="13" font-weight="600">token</text>
      <text x="280" y="0" fill="#94a3b8" font-size="12" text-anchor="end">TEXT (NOT NULL)</text>
    </g>
  </g>

  <!-- TABLE: JOBS -->
  <g transform="translate(730, 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="340" height="520" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <path d="M 0 0 L 340 0 L 340 40 L 0 40 Z" fill="#0369a1" rx="8" />
    <text x="15" y="26" fill="#ffffff" font-size="16" font-weight="700">jobs</text>
    <text x="325" y="25" fill="#bae6fd" font-size="11" text-anchor="end">CENTRAL TABLE</text>
    
    <g transform="translate(15, 62)">
      <rect x="0" y="-12" width="26" height="15" rx="3" fill="#ef4444" />
      <text x="5" y="-1" fill="#fff" font-size="9" font-weight="700">PK</text>
      <text x="35" y="0" fill="#f8fafc" font-size="13" font-weight="600">id</text>
      <text x="310" y="0" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <rect x="0" y="16" width="26" height="15" rx="3" fill="#3b82f6" />
      <text x="5" y="27" fill="#fff" font-size="9" font-weight="700">FK</text>
      <text x="35" y="28" fill="#38bdf8" font-size="13" font-weight="600">company_id</text>
      <text x="310" y="28" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <rect x="0" y="44" width="26" height="15" rx="3" fill="#3b82f6" />
      <text x="5" y="55" fill="#fff" font-size="9" font-weight="700">FK</text>
      <text x="35" y="56" fill="#38bdf8" font-size="13" font-weight="600">category_id</text>
      <text x="310" y="56" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <text x="35" y="84" fill="#f8fafc" font-size="13">title</text>
      <text x="310" y="84" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(255)</text>

      <text x="35" y="112" fill="#f8fafc" font-size="13">description</text>
      <text x="310" y="112" fill="#94a3b8" font-size="12" text-anchor="end">TEXT</text>

      <text x="35" y="140" fill="#f8fafc" font-size="13">job_type</text>
      <text x="310" y="140" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <text x="35" y="168" fill="#f8fafc" font-size="13">experience_level</text>
      <text x="310" y="168" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <text x="35" y="196" fill="#f8fafc" font-size="13">location_type</text>
      <text x="310" y="196" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <text x="35" y="224" fill="#f8fafc" font-size="13">location_city</text>
      <text x="310" y="224" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(255)</text>

      <text x="35" y="252" fill="#f8fafc" font-size="13">salary_min</text>
      <text x="310" y="252" fill="#94a3b8" font-size="12" text-anchor="end">BIGINT</text>

      <text x="35" y="280" fill="#f8fafc" font-size="13">salary_max</text>
      <text x="310" y="280" fill="#94a3b8" font-size="12" text-anchor="end">BIGINT</text>

      <text x="35" y="308" fill="#f8fafc" font-size="13">is_salary_visible</text>
      <text x="310" y="308" fill="#94a3b8" font-size="12" text-anchor="end">BOOLEAN</text>

      <text x="35" y="336" fill="#f8fafc" font-size="13">status</text>
      <text x="310" y="336" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <text x="35" y="364" fill="#64748b" font-size="12">created_at</text>
      <text x="310" y="364" fill="#64748b" font-size="12" text-anchor="end">TIMESTAMPTZ</text>

      <text x="35" y="392" fill="#64748b" font-size="12">updated_at</text>
      <text x="310" y="392" fill="#64748b" font-size="12" text-anchor="end">TIMESTAMPTZ</text>
    </g>
  </g>

  <!-- TABLE: USERS -->
  <g transform="translate(1360, 160)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="250" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 0 L 310 0 L 310 40 L 0 40 Z" fill="#6366f1" rx="8" />
    <text x="15" y="26" fill="#ffffff" font-size="15" font-weight="700">users</text>
    <text x="295" y="25" fill="#e0e7ff" font-size="11" text-anchor="end">TABLE</text>
    
    <g transform="translate(15, 62)">
      <rect x="0" y="-12" width="26" height="15" rx="3" fill="#ef4444" />
      <text x="5" y="-1" fill="#fff" font-size="9" font-weight="700">PK</text>
      <text x="35" y="0" fill="#f8fafc" font-size="13" font-weight="600">id</text>
      <text x="280" y="0" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <text x="35" y="28" fill="#f8fafc" font-size="13">name</text>
      <text x="280" y="28" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(255)</text>

      <rect x="0" y="44" width="26" height="15" rx="3" fill="#10b981" />
      <text x="5" y="55" fill="#fff" font-size="9" font-weight="700">UK</text>
      <text x="35" y="56" fill="#34d399" font-size="13" font-weight="600">email</text>
      <text x="280" y="56" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(255)</text>

      <text x="35" y="84" fill="#f8fafc" font-size="13">password</text>
      <text x="280" y="84" fill="#94a3b8" font-size="12" text-anchor="end">TEXT</text>

      <text x="35" y="112" fill="#f8fafc" font-size="13">role</text>
      <text x="280" y="112" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <text x="35" y="140" fill="#64748b" font-size="12">created_at</text>
      <text x="280" y="140" fill="#64748b" font-size="12" text-anchor="end">TIMESTAMPTZ</text>

      <text x="35" y="168" fill="#64748b" font-size="12">updated_at</text>
      <text x="280" y="168" fill="#64748b" font-size="12" text-anchor="end">TIMESTAMPTZ</text>
    </g>
  </g>

  <!-- TABLE: APPLICATIONS -->
  <g transform="translate(1160, 460)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="230" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 0 L 310 0 L 310 40 L 0 40 Z" fill="#8b5cf6" rx="8" />
    <text x="15" y="26" fill="#ffffff" font-size="15" font-weight="700">applications</text>
    <text x="295" y="25" fill="#ede9fe" font-size="11" text-anchor="end">TABLE</text>
    
    <g transform="translate(15, 62)">
      <rect x="0" y="-12" width="26" height="15" rx="3" fill="#ef4444" />
      <text x="5" y="-1" fill="#fff" font-size="9" font-weight="700">PK</text>
      <text x="35" y="0" fill="#f8fafc" font-size="13" font-weight="600">id</text>
      <text x="280" y="0" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <rect x="0" y="16" width="26" height="15" rx="3" fill="#3b82f6" />
