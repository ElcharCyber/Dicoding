      <text x="35" y="28" fill="#38bdf8" font-size="13" font-weight="600">user_id</text>
      <text x="280" y="28" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <rect x="0" y="44" width="26" height="15" rx="3" fill="#3b82f6" />
      <text x="5" y="55" fill="#fff" font-size="9" font-weight="700">FK</text>
      <text x="35" y="56" fill="#38bdf8" font-size="13" font-weight="600">job_id</text>
      <text x="280" y="56" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <text x="35" y="84" fill="#f8fafc" font-size="13">status</text>
      <text x="280" y="84" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <text x="35" y="112" fill="#64748b" font-size="12">created_at</text>
      <text x="280" y="112" fill="#64748b" font-size="12" text-anchor="end">TIMESTAMPTZ</text>

      <text x="35" y="140" fill="#64748b" font-size="12">updated_at</text>
      <text x="280" y="140" fill="#64748b" font-size="12" text-anchor="end">TIMESTAMPTZ</text>
    </g>
  </g>

  <!-- TABLE: BOOKMARKS -->
  <g transform="translate(1160, 750)" filter="url(#shadow)">
    <rect x="0" y="0" width="310" height="170" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <path d="M 0 0 L 310 0 L 310 40 L 0 40 Z" fill="#ec4899" rx="8" />
    <text x="15" y="26" fill="#ffffff" font-size="15" font-weight="700">bookmarks</text>
    <text x="295" y="25" fill="#fce7f3" font-size="11" text-anchor="end">TABLE</text>
    
    <g transform="translate(15, 62)">
      <rect x="0" y="-12" width="26" height="15" rx="3" fill="#ef4444" />
      <text x="5" y="-1" fill="#fff" font-size="9" font-weight="700">PK</text>
      <text x="35" y="0" fill="#f8fafc" font-size="13" font-weight="600">id</text>
      <text x="280" y="0" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <rect x="0" y="16" width="26" height="15" rx="3" fill="#3b82f6" />
      <text x="5" y="27" fill="#fff" font-size="9" font-weight="700">FK</text>
      <text x="35" y="28" fill="#38bdf8" font-size="13" font-weight="600">user_id</text>
      <text x="280" y="28" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <rect x="0" y="44" width="26" height="15" rx="3" fill="#3b82f6" />
      <text x="5" y="55" fill="#fff" font-size="9" font-weight="700">FK</text>
      <text x="35" y="56" fill="#38bdf8" font-size="13" font-weight="600">job_id</text>
      <text x="280" y="56" fill="#94a3b8" font-size="12" text-anchor="end">VARCHAR(50)</text>

      <text x="35" y="84" fill="#64748b" font-size="12">created_at</text>
      <text x="280" y="84" fill="#64748b" font-size="12" text-anchor="end">TIMESTAMPTZ</text>
